<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aria Nova — Restaurant gastronomique à Bonifacio</title>
<meta name="description" content="Aria Nova, restaurant gastronomique corse dans la haute ville de Bonifacio. Cuisine faite maison, producteurs locaux, cave 100 % corse.">
<meta name="theme-color" content="#120F0C">
<meta property="og:title" content="Aria Nova — Bonifacio">
<meta property="og:description" content="Restaurant gastronomique corse, haute ville de Bonifacio.">
<meta property="og:image" content="assets/facade.jpg">
<link rel="icon" href="assets/logo-or.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;0,500;0,600;1,200;1,300&amp;display=swap">
<style>
body{margin:0;background:#FAF7F2}
a{color:#7A5B33}a:hover{color:#4E3A1F}
.an-dark a{color:#D8B582}.an-dark a:hover{color:#F1DDBD}
@keyframes anRise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes anFade{from{opacity:0}to{opacity:1}}
@keyframes anKen{from{transform:scale(1.18)}to{transform:scale(1.02)}}
@keyframes anDrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes anLine{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes anReveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes anCurtain{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes anScroll{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@keyframes anSwap{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes anFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.an-in{opacity:0;animation:anRise 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.an-fade{opacity:0;animation:anFade 1.8s ease forwards}
.an-ken{animation:anKen 14s cubic-bezier(.2,.7,.2,1) both}
.an-curtain{animation:anCurtain 1.6s cubic-bezier(.7,0,.2,1) both}
.an-logo{animation:anReveal 2.2s cubic-bezier(.65,0,.25,1) .9s both}
.an-rule{transform-origin:left;animation:anLine 1.4s cubic-bezier(.2,.7,.2,1) .8s both}
.an-scroll{animation:anScroll 2.4s cubic-bezier(.65,0,.35,1) infinite}
.an-swap{animation:anSwap .9s cubic-bezier(.2,.7,.2,1) both}
.an-float{animation:anFloat 8s ease-in-out infinite}
.an-marquee{display:flex;width:max-content;animation:anDrift 42s linear infinite}
.an-btn{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background-color .35s,color .35s}
.an-btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px -16px rgba(0,0,0,.55)}
.an-zoom{overflow:hidden}
.an-zoom img{transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.an-zoom:hover img{transform:scale(1.07)}
.an-dish{transition:padding-left .35s,background-color .35s}
.an-dish:hover{padding-left:14px;background-color:rgba(201,156,97,.08)}
.an-link{position:relative;text-decoration:none}
.an-link:after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .4s}
.an-link:hover:after{transform:scaleX(1);transform-origin:left}
.an-eb{display:flex;align-items:center;gap:16px}
.an-eb::before{content:"";flex:0 0 auto;width:42px;height:1px;background:currentColor;opacity:.8}
.an-langswap{animation:anFade .6s ease both}
.an-strip{scroll-snap-type:x mandatory;scrollbar-width:none}
.an-strip::-webkit-scrollbar{display:none}
.an-strip > *{scroll-snap-align:start}
input,select{font:inherit}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid #C99C61;outline-offset:2px}

@media (max-width: 860px){
.an-navlinks,.an-lang,.an-navcta{display:none !important}
.an-burger{display:inline-flex !important}
.an-hero{min-height:760px !important}
.an-hero-cols{grid-template-columns:1fr !important}
.an-hero-side{display:none !important}
.an-floatcard{display:none !important}
.an-span2{grid-column:auto !important}
.an-row2{grid-row:auto !important}
.an-sec{padding-top:84px !important;padding-bottom:84px !important}
.an-cave-grid{grid-template-columns:1fr 1fr !important}
.an-cave-grid > div:first-child{grid-column:1 / -1 !important}
.an-cave-grid img{height:auto !important;min-height:0 !important;aspect-ratio:3 / 4}
.an-cave-grid > div:first-child img{aspect-ratio:2 / 3}
.an-mobilebar{display:flex !important}
.an-footer{padding-bottom:110px !important}
.an-sticky{position:static !important}
.an-bigimg{height:380px !important}
}
@media (prefers-reduced-motion: reduce){.an-in,.an-fade,.an-ken,.an-curtain,.an-logo,.an-rule,.an-swap,.an-r,.an-rimg{animation:none !important;opacity:1;transform:none;clip-path:none}.an-marquee,.an-float,.an-scroll{animation:none}}
</style>
<style>
html.an-ready .an-in,html.an-ready .an-fade,html.an-ready .an-curtain,html.an-ready .an-logo,html.an-ready .an-ken,html.an-ready .an-rule{animation:none!important;opacity:1!important;clip-path:none!important;transform:none!important}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: 'Jost', system-ui, sans-serif; font-weight: 400; color: #1A1714; background-color: #FAF7F2; width: 100%; overflow: hidden; position: relative">

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
  <header id="top" class="an-hero an-dark" style="position: relative; min-height: 900px; background-color: #120F0C; color: #F4EEE4; display: flex; flex-direction: column; overflow: hidden">
    <div class="an-hero-cols" aria-hidden="true" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <div class="an-curtain" style="overflow: hidden; animation-delay: .05s"><img class="an-ken" src="assets/facade.jpg" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover"></div>
      <div class="an-curtain an-hero-side" style="overflow: hidden; animation-delay: .2s"><img class="an-ken" src="assets/plat-fleurs.jpg" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; animation-delay: .2s"></div>
      <div class="an-curtain an-hero-side" style="overflow: hidden; animation-delay: .35s"><img class="an-ken" src="assets/cave.jpg" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; animation-delay: .35s"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; inset: 0; background-color: rgba(18,15,12,.58)"></div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 320px; background-image: linear-gradient(to top, rgba(18,15,12,.95), rgba(18,15,12,0))"></div>

    <nav aria-label="Navigation principale" style="position: relative; z-index: 6; max-width: 1320px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 26px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px">
      <div class="an-navlinks an-fade" style="display: flex; flex-wrap: wrap; gap: 4px 26px; animation-delay: 1.4s">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
          <button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" class="an-link" style="{{n.style}}">{{n.label}}</button>
        </sc-for>
      </div>
      <a href="#top" class="an-burger" aria-label="Aria Nova, accueil" style="display: none; line-height: 0"><img src="assets/logo-blanc.svg" alt="Aria Nova" style="height: 34px; width: auto"></a>
      <div class="an-fade" style="display: flex; align-items: center; gap: 10px; animation-delay: 1.5s">
        <div class="an-lang" role="group" aria-label="Langue" style="display: flex">
          <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
            <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="{{l.style}}">{{l.code}}</button>
          </sc-for>
        </div>
        <a href="#reserver" class="an-btn an-navcta" style="text-decoration: none; background-color: #F4EEE4; color: #1A1714; padding: 0 26px; min-height: 46px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase">{{t.reserve}}</a>
        <button type="button" class="an-burger" onClick="{{toggleMenu}}" aria-label="Ouvrir le menu" aria-expanded="{{menuExpanded}}" style="display: none; width: 48px; height: 48px; align-items: center; justify-content: center; background-color: transparent; border: 1px solid rgba(244,238,228,.45); color: #F4EEE4; cursor: pointer">
          <svg aria-hidden="true" width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="0" y1="1" x2="20" y2="1"></line><line x1="0" y1="7" x2="20" y2="7"></line><line x1="6" y1="13" x2="20" y2="13"></line></svg>
        </button>
      </div>
    </nav>

    <div style="position: relative; z-index: 3; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px 60px">
      <p class="an-in" style="margin: 0 0 34px; font-size: 12px; letter-spacing: .5em; text-transform: uppercase; color: #E7CFA6; animation-delay: .7s">{{t.hero_kicker}}</p>
      <h1 style="margin: 0; line-height: 0"><img class="an-logo" src="assets/logo-blanc.svg" alt="Aria Nova" style="width: min(760px, 86%); height: auto"></h1>
      <p class="an-in" style="margin: 38px 0 0; max-width: 620px; font-size: clamp(19px, 2vw, 24px); font-weight: 200; line-height: 1.6; letter-spacing: .04em; animation-delay: 1.6s">{{t.hero_sub}}</p>
      <div class="an-in" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 46px; animation-delay: 1.8s">
        <a href="#reserver" class="an-btn" style="text-decoration: none; background-color: #C5B9A2; color: #1A1714; padding: 0 36px; min-height: 56px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase">{{t.reserve_table}}</a>
        <a href="#carte" class="an-btn" style="text-decoration: none; color: #F4EEE4; border: 1px solid rgba(244,238,228,.6); padding: 0 36px; min-height: 56px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase">{{t.discover}}</a>
      </div>
    </div>

    <div class="an-fade" style="position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 34px; animation-delay: 2.4s">
      <span style="font-size: 10px; letter-spacing: .5em; text-transform: uppercase; color: #C9BFAF">{{t.scroll}}</span>
      <span aria-hidden="true" style="display: block; width: 1px; height: 56px; background-color: rgba(244,238,228,.25); position: relative; overflow: hidden"><span class="an-scroll" style="position: absolute; inset: 0; background-color: #E7CFA6"></span></span>
    </div>

    <div style="position: relative; z-index: 3; border-top: 1px solid rgba(244,238,228,.14)">
      <div style="max-width: 1320px; margin: 0 auto; box-sizing: border-box; padding: 20px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 40px; font-size: 13px; font-weight: 300; letter-spacing: .06em; color: #E9E1D3">
        <span><span style="color: #E7CFA6; letter-spacing: .26em; text-transform: uppercase; font-size: 10px; margin-right: 10px">{{t.open_l}}</span>{{t.open_v}}</span>
        <span><span style="color: #E7CFA6; letter-spacing: .26em; text-transform: uppercase; font-size: 10px; margin-right: 10px">{{t.season_l}}</span>{{t.season_v}}</span>
        <span><span style="color: #E7CFA6; letter-spacing: .26em; text-transform: uppercase; font-size: 10px; margin-right: 10px">{{t.addr_l}}</span>4 rue Fred Scamaroni</span>
        <a href="tel:+33495731985" style="color: #F1DDBD; text-decoration: none">04 95 73 19 85</a>
      </div>
    </div>
  </header>
  </sc-if>

  <sc-if value="{{isSub}}" hint-placeholder-val="{{ false }}">
    <header class="an-dark" style="position: relative; min-height: 640px; background-color: #120F0C; color: #F4EEE4; display: flex; flex-direction: column; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden"><img class="an-ken" key="{{pageKey}}" src="{{pageImg}}" alt="" style="display: block; width: 100%; height: 100%; object-fit: cover; opacity: .5"></div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(to top, rgba(18,15,12,.92), rgba(18,15,12,.25) 60%, rgba(18,15,12,.55))"></div>
      <nav aria-label="Navigation principale" style="position: relative; z-index: 6; max-width: 1320px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px">
        <button type="button" onClick="{{goHome}}" aria-label="Aria Nova, accueil" style="background: none; border: 0; padding: 0; cursor: pointer; line-height: 0"><img src="assets/logo-blanc.svg" alt="Aria Nova" style="height: 40px; width: auto"></button>
        <div class="an-navlinks" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 26px">
          <sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
            <button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" class="an-link" style="{{n.style}}">{{n.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <button type="button" onClick="{{goReserve}}" class="an-btn an-navcta" style="border: 0; cursor: pointer; background-color: #F4EEE4; color: #1A1714; padding: 0 24px; min-height: 46px; font-family: Jost, sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase">{{t.reserve}}</button>
          <button type="button" class="an-burger" onClick="{{toggleMenu}}" aria-label="Ouvrir le menu" aria-expanded="{{menuExpanded}}" style="display: none; width: 48px; height: 48px; align-items: center; justify-content: center; background-color: transparent; border: 1px solid rgba(244,238,228,.45); color: #F4EEE4; cursor: pointer">
            <svg aria-hidden="true" width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="0" y1="1" x2="20" y2="1"></line><line x1="0" y1="7" x2="20" y2="7"></line><line x1="6" y1="13" x2="20" y2="13"></line></svg>
          </button>
        </div>
      </nav>
      <div key="{{pageKey}}" style="position: relative; z-index: 3; flex: 1; max-width: 1320px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: 60px 24px 80px; display: flex; flex-direction: column; justify-content: flex-end">
        <p class="an-in an-eb" style="margin: 0 0 26px; font-size: 12px; letter-spacing: .44em; text-transform: uppercase; color: #E7CFA6; animation-delay: .1s">{{pageKicker}}</p>
        <h1 class="an-in" style="margin: 0; max-width: 980px; font-weight: 200; font-size: clamp(34px, 5.2vw, 72px); line-height: 1.08; letter-spacing: .04em; text-transform: uppercase; animation-delay: .25s">{{pageTitle}}</h1>
        <p class="an-in" style="margin: 26px 0 0; max-width: 620px; font-size: clamp(17px, 1.6vw, 21px); font-weight: 200; line-height: 1.6; color: #E9E1D3; animation-delay: .4s">{{pageLead}}</p>
      </div>
    </header>

    <article key="{{pageKey}}" class="an-swap" style="background-color: #FAF7F2">
      <div style="max-width: 1320px; margin: 0 auto; box-sizing: border-box; padding: 110px 24px 40px">
        <sc-for list="{{pageSections}}" as="s" hint-placeholder-count="4">
          <section style="display: flex; flex-wrap: wrap; gap: 30px 70px; padding: 56px 0; border-top: 1px solid #D9CFBE">
            <div style="flex: 1 1 300px; min-width: 0">
              <p style="margin: 0 0 18px; font-size: 13px; letter-spacing: .3em; color: #7A5B33">{{s.num}}</p>
              <h2 style="margin: 0; font-weight: 300; font-size: clamp(24px, 2.4vw, 34px); line-height: 1.25; letter-spacing: .05em; text-transform: uppercase">{{s.h}}</h2>
              <sc-if value="{{s.hasImg}}" hint-placeholder-val="{{ false }}">
                <div class="an-zoom" style="margin-top: 34px"><img src="{{s.img}}" alt="{{s.h}}" style="display: block; width: 100%; height: 340px; object-fit: cover"></div>
              </sc-if>
            </div>
            <div style="flex: 1.5 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
              <sc-for list="{{s.ps}}" as="para" hint-placeholder-count="2">
                <p style="margin: 0; font-size: 17px; font-weight: 300; line-height: 1.9; color: #3E3832">{{para.txt}}</p>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </div>

      <div style="max-width: 1320px; margin: 0 auto; box-sizing: border-box; padding: 0 24px 110px">
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; background-color: #1F1B17; color: #F4EEE4; padding: clamp(28px, 5vw, 56px)" class="an-dark">
          <div>
            <p style="margin: 0; font-size: 11px; letter-spacing: .4em; text-transform: uppercase; color: #E7CFA6">{{t.rs_eb}}</p>
            <p style="margin: 12px 0 0; font-size: clamp(24px, 3vw, 38px); font-weight: 200; letter-spacing: .05em; text-transform: uppercase">{{t.rs_h_a}} <span style="color: #E7CFA6; font-style: italic; font-weight: 300">{{t.rs_h_b}}</span></p>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 12px">
            <a href="tel:+33495731985" class="an-btn" style="text-decoration: none; color: #F4EEE4; border: 1px solid rgba(244,238,228,.5); padding: 0 26px; min-height: 52px; display: inline-flex; align-items: center; font-size: 12px; letter-spacing: .2em">04 95 73 19 85</a>
            <button type="button" onClick="{{goReserve}}" class="an-btn" style="border: 0; cursor: pointer; background-color: #C5B9A2; color: #1A1714; padding: 0 30px; min-height: 52px; font-family: Jost, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase">{{t.reserve_table}}</button>
          </div>
        </div>

        <p class="an-eb" style="margin: 90px 0 30px; font-size: 12px; letter-spacing: .44em; text-transform: uppercase; color: #7A5B33">{{t.more}}</p>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
          <sc-for list="{{related}}" as="r" hint-placeholder-count="3">
            <button type="button" onClick="{{r.go}}" class="an-zoom an-btn" style="position: relative; display: block; width: 100%; height: 360px; padding: 0; border: 0; cursor: pointer; text-align: left; background-color: #120F0C; overflow: hidden">
              <img src="{{r.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .6">
              <span style="position: absolute; left: 0; right: 0; bottom: 0; padding: 26px; background-image: linear-gradient(to top, rgba(18,15,12,.9), rgba(18,15,12,0)); display: flex; flex-direction: column; gap: 10px">
                <span style="font-family: Jost, sans-serif; font-size: 11px; letter-spacing: .36em; text-transform: uppercase; color: #E7CFA6">{{r.kicker}}</span>
                <span style="font-family: Jost, sans-serif; font-size: 20px; font-weight: 300; line-height: 1.3; letter-spacing: .05em; text-transform: uppercase; color: #F4EEE4">{{r.title}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
    </article>
  </sc-if>


  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div class="an-dark" role="dialog" aria-label="Menu" style="position: fixed; inset: 0; z-index: 50; background-color: #120F0C; color: #F4EEE4; display: flex; flex-direction: column; padding: 26px 24px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <img src="assets/logo-blanc.svg" alt="Aria Nova" style="height: 34px; width: auto">
        <button type="button" onClick="{{toggleMenu}}" aria-label="Fermer le menu" style="width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; background-color: transparent; border: 1px solid rgba(244,238,228,.45); color: #F4EEE4; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="1" y1="1" x2="15" y2="15"></line><line x1="15" y1="1" x2="1" y2="15"></line></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; margin-top: 50px">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="7">
          <button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.styleBig}}">{{n.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 6px; margin-top: 30px">
        <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
          <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}" style="{{l.styleDark}}">{{l.code}}</button>
        </sc-for>
      </div>
      <a href="#reserver" onClick="{{goReserve}}" style="margin-top: auto; text-decoration: none; background-color: #C5B9A2; color: #1A1714; min-height: 58px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase">{{t.reserve_table}}</a>
    </div>
  </sc-if>

  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
  <section aria-label="Distinctions" style="background-color: #FAF7F2; overflow: hidden; padding: 30px 0; border-bottom: 1px solid #E8E0D2">
    <div class="an-marquee" style="gap: 60px; font-size: 13px; font-weight: 300; letter-spacing: .36em; text-transform: uppercase; white-space: nowrap; color: #4A433B">
